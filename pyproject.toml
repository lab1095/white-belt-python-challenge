[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-store"
version = "0.1.0"
description = "Flask order and customer service dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "openai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
mock-store-seed = "mock_store.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mock_store = ["templates/*.html", "static/*.css", "schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "no-any-return", "return-value", "untyped-decorator", "union-attr"]
mypy_path = "src"
exclude = "(^|/)tests/"
